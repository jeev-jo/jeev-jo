name: Update contribution streak

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate streak images
        run: python scripts/generate_streak.py

      - name: Commit updated streak images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution streak"
          file_pattern: assets/streak-dark.svg assets/streak-light.svg
